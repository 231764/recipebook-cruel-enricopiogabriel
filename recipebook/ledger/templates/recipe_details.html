{% extends 'base.html' %}  

{% block title %}{{ object.name }}{% endblock %}

{% block content %} 
    <h2>{{ object.name }}</h2>

    <ul>
        {% for ingredient in object.ingredients.all %}
        <li>{{ ingredient.quantity }} of {{ ingredient.ingredient.name }} </li>
     {% endfor %}
    
        
    </ul>
{% endblock %}
